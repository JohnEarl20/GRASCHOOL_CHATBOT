# Streamlit theme for the Cognitive Campus Assistant.
# The tokens here are the ones the CSS in app.py also uses, so the framework
# chrome and the custom cards stay in the same colour system.
[server]
headless = true
# Serves files under ./static/ at /app/static/<name>. The login wallpaper is
# 1.9 MB; inlining it as a data URI would push 2.4 MB of base64 into the page
# on every rerun, so it is served as a cacheable file instead.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# The Streamlit overflow menu (Rerun / Settings / Print / Record / Developer
# options / Clear cache) is developer chrome, not part of this app, and it
# renders on a light surface that cannot be recoloured reliably. Hide it.
toolbarMode = "minimal"

# The app is dark-only. These values mirror DARK_TOKENS in ui/theme.py so
# Streamlit's own widgets (portals, dialogs, the file uploader) start from the
# same palette instead of flashing a light surface before the CSS lands.
[theme]
base = "dark"
primaryColor = "#2F6BFF"
backgroundColor = "#070B1F"
secondaryBackgroundColor = "#141C3D"
textColor = "#EDF1FF"
font = "sans serif"
