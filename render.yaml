services:
  - type: web
    name: graschool-chatbot
    runtime: python
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: BOOTSTRAP_ADMIN_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_USERS_JSON_TO_DATABASE
        sync: false
